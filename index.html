<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monthly Budget Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f4;--surface:#fff;--ink:#12212b;--muted:#5d6f7b;--line:#d9e1e6;--accent:#0f6b62;--accent-ink:#fff;--pos:#0f6b62;--neg:#b4372f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e171c;--surface:#16232a;--ink:#e8eff2;--muted:#8fa3ae;--line:#26373f;--accent:#3cc4b4;--accent-ink:#06211e;--pos:#3cc4b4;--neg:#ff8a7e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e171c;--surface:#16232a;--ink:#e8eff2;--muted:#8fa3ae;--line:#26373f;--accent:#3cc4b4;--accent-ink:#06211e;--pos:#3cc4b4;--neg:#ff8a7e;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.01em}
.month{display:flex;align-items:center;gap:6px}
.month button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer}
.month span{min-width:118px;text-align:center;font-weight:600}
.left{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:20px;margin-bottom:12px}
.left small{opacity:.85;font-size:14px}
.left .big{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.left .big.neg{color:inherit;text-decoration:underline wavy;text-decoration-thickness:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat small{color:var(--muted)}
.stat b{display:block;font-size:22px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 12px;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{border:0;background:none;color:var(--muted);padding:9px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form .full{grid-column:1/-1}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:3px}
input,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add{grid-column:1/-1;border:0;border-radius:10px;padding:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:800;cursor:pointer}
.chart{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center}
.chart svg{width:200px;height:200px;flex:none}
.legend{flex:1;min-width:190px;list-style:none;margin:0;padding:0}
.legend li{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend .n{flex:1}.legend .p{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:14px 0;margin:0}
ul.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .t{flex:1;min-width:0}
.list .t b{display:block;font-weight:600}
.list .t span{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.amt.in{color:var(--pos)}.amt.out{color:var(--neg)}
.amt{font-weight:600;white-space:nowrap}
.del{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px}
</style>
</head>
<body>
<main>
<header>
  <h1>Budget tracker</h1>
  <div class="month"><button id="prev" aria-label="Previous month">‹</button><span id="mlabel"></span><button id="next" aria-label="Next month">›</button></div>
</header>

<section class="left" aria-live="polite"><small>Left this month</small><div class="big" id="left">$0</div></section>
<div class="row2">
  <div class="stat"><small>Income</small><b id="inc" style="color:var(--pos)">$0</b></div>
  <div class="stat"><small>Spent</small><b id="exp" style="color:var(--neg)">$0</b></div>
</div>

<section class="card">
  <h2>Add an entry</h2>
  <div class="seg" role="group" aria-label="Entry type">
    <button type="button" id="tExp" aria-pressed="true">Expense</button>
    <button type="button" id="tInc" aria-pressed="false">Income</button>
  </div>
  <form id="f">
    <div><label for="cat">Category</label><select id="cat"></select></div>
    <div><label for="amt">Amount</label><input id="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" required></div>
    <div class="full"><label for="note">Note (optional)</label><input id="note" type="text" maxlength="60" placeholder="e.g. Rent for October"></div>
    <button class="add" type="submit" id="addBtn">Add expense</button>
  </form>
</section>

<section class="card">
  <h2>Where your money went</h2>
  <div id="chartWrap"></div>
</section>

<section class="card">
  <h2>This month’s entries</h2>
  <div id="entries"></div>
</section>
</main>

<script>
const EXP=['Housing','Groceries','Transport','Dining out','Bills & utilities','Health','Fun','Shopping','Savings','Other'];
const INC=['Salary','Freelance','Gifts','Other income'];
const COLORS=['#0f6b62','#e08a1e','#3b6fd4','#c2475f','#7a54c4','#2fa36b','#d4b012','#4aa3c7','#8a6a4f','#7f8c95'];
const KEY='budget-tracker-v1';
let entries=[];try{entries=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){entries=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(entries))}catch(e){}};
let cur=new Date();cur=new Date(cur.getFullYear(),cur.getMonth(),1);
let type='expense';
const $=id=>document.getElementById(id);
const money=n=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:Math.abs(n)%1?2:0,maximumFractionDigits:2});
const mk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fillCats(){$('cat').innerHTML=(type==='expense'?EXP:INC).map(c=>`<option>${esc(c)}</option>`).join('');
  $('tExp').setAttribute('aria-pressed',type==='expense');$('tInc').setAttribute('aria-pressed',type==='income');
  $('addBtn').textContent=type==='expense'?'Add expense':'Add income'}

function arc(cx,cy,r,a0,a1){const p=a=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];const [x0,y0]=p(a0),[x1,y1]=p(a1);
  return `M${cx} ${cy}L${x0} ${y0}A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1} ${y1}Z`}

function render(){
  const m=mk(cur);
  $('mlabel').textContent=cur.toLocaleString('en-US',{month:'long',year:'numeric'});
  const list=entries.filter(e=>e.month===m);
  const inc=list.filter(e=>e.type==='income').reduce((s,e)=>s+e.amt,0);
  const ex=list.filter(e=>e.type==='expense');
  const spent=ex.reduce((s,e)=>s+e.amt,0);
  $('inc').textContent=money(inc);$('exp').textContent=money(spent);
  $('left').textContent=money(inc-spent);$('left').classList.toggle('neg',inc-spent<0);

  const by={};ex.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amt);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  if(!rows.length){$('chartWrap').innerHTML='<p class="empty">Add an expense to see your spending chart.</p>'}
  else{
    let a=-Math.PI/2,svg='<svg viewBox="0 0 200 200" role="img" aria-label="Pie chart of spending by category">';
    rows.forEach(([c,v],i)=>{const col=COLORS[EXP.indexOf(c)%COLORS.length]||COLORS[9];const sweep=v/spent*Math.PI*2;
      svg+= rows.length===1?`<circle cx="100" cy="100" r="95" fill="${col}"/>`:`<path d="${arc(100,100,95,a,a+sweep)}" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;a+=sweep});
    svg+='</svg>';
    const leg=rows.map(([c,v])=>`<li><i style="background:${COLORS[EXP.indexOf(c)%COLORS.length]||COLORS[9]}"></i><span class="n">${esc(c)}</span><b>${money(v)}</b><span class="p">${Math.round(v/spent*100)}%</span></li>`).join('');
    $('chartWrap').innerHTML=`<div class="chart">${svg}<ul class="legend">${leg}</ul></div>`;
  }

  $('entries').innerHTML=list.length?'<ul class="list">'+[...list].reverse().map(e=>`<li><div class="t"><b>${esc(e.cat)}</b>${e.note?`<span>${esc(e.note)}</span>`:''}</div><span class="amt ${e.type==='income'?'in':'out'}">${e.type==='income'?'+':'−'}${money(e.amt)}</span><button class="del" data-id="${e.id}" aria-label="Delete entry">×</button></li>`).join('')+'</ul>':'<p class="empty">Nothing here yet. Add your income first, then your expenses.</p>';
}

$('f').addEventListener('submit',ev=>{ev.preventDefault();
  const amt=parseFloat($('amt').value);if(!(amt>0))return;
  entries.push({id:Date.now()+Math.random().toString(36).slice(2,6),month:mk(cur),type,cat:$('cat').value,amt,note:$('note').value.trim()});
  save();$('amt').value='';$('note').value='';render();$('amt').focus()});
$('entries').addEventListener('click',ev=>{const b=ev.target.closest('.del');if(!b)return;entries=entries.filter(e=>e.id!==b.dataset.id);save();render()});
$('tExp').onclick=()=>{type='expense';fillCats()};$('tInc').onclick=()=>{type='income';fillCats()};
$('prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
$('next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
fillCats();render();
</script>
</body>
</html>
